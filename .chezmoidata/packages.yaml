# Every package the setup scripts install. Editing a list re-runs only the script that uses it.
packages:
  all:
    brews:
      - gh
      - mise
      - openssl@3
      - python@3.15
      - uv
    # Tool name: Python version ("" = newest uv-managed Python)
    uvTools:
      ipython: ""
      # hidapi has no Python 3.15 build yet, and building it on Bazzite fails without libusb headers
      rivalcfg: "3.14"
      wakepy: ""
    vscodeExtensions:
      - anthropic.claude-code
      - castwide.solargraph
      - hashicorp.terraform
      - mechatroner.rainbow-csv
      - ms-azuretools.vscode-containers
      - ms-python.debugpy
      - ms-python.python
      - ms-python.vscode-pylance
      - ms-python.vscode-python-envs
      - ms-toolsai.datawrangler
      - ms-toolsai.jupyter
      - ms-toolsai.jupyter-keymap
      - ms-toolsai.jupyter-renderers
      - ms-toolsai.vscode-jupyter-cell-tags
      - ms-toolsai.vscode-jupyter-slideshow
      - ms-vscode-remote.remote-containers
      - ms-vscode-remote.remote-ssh
      - ms-vscode-remote.remote-ssh-edit
      - ms-vscode.makefile-tools
      - ms-vscode.remote-explorer
      - rangav.vscode-thunder-client
      - shopify.ruby-lsp
      - vayan.haml
      - vscodevim.vim
      - yzhang.markdown-all-in-one

  # Chrome, Slack, Zoom, Claude, and DisplayLink are installed by MDM (Iru Self Service) on the work Mac
  darwin:
    taps:
      - anthropics/tap
    brews:
      - dbus
    casks:
      - anthropics/tap/ant
      - bruno
      - claude-code
      - docker-desktop
      - ghostty
      - obsidian
      - scroll-reverser
      - visual-studio-code

  linux:
    brews:
      - zsh
    # VS Code is added as a Flatpak only when `code` isn't installed (bazzite-dx ships it natively)
    flatpaks:
      - com.google.Chrome
      - com.usebruno.Bruno
      - md.obsidian.Obsidian

  work:
    taps:
      - heroku/brew
    brews:
      - astro
      - tfenv
      - heroku/brew/heroku
      - libpq
    # Casks only exist on macOS
    casks:
      - gcloud-cli
      - ngrok
